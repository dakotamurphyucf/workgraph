name: AlmaLinux 10 package

on:
  workflow_dispatch:
    inputs:
      optional_ui:
        description: Include the optional UI archive and exact-core-dependency UI RPM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORKGRAPH_PACKAGE_UI: ${{ inputs.optional_ui && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build isolated AlmaLinux toolchain
        run: |
          docker build --platform linux/amd64 \
            -f packaging/almalinux/Containerfile \
            --build-arg BUILDER_UID="$(id -u)" \
            --build-arg BUILDER_GID="$(id -g)" \
            --build-arg WORKGRAPH_PACKAGE_UI="$WORKGRAPH_PACKAGE_UI" \
            -t workgraph-alma-builder .
      - name: Build, test and package
        run: |
          mkdir -p dist/almalinux-10-x86_64
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/source:ro" \
            -v "$PWD/dist/almalinux-10-x86_64:/out" \
            workgraph-alma-builder /usr/local/bin/workgraph-build /source /out
      - name: Verify packages in a fresh AlmaLinux runtime
        run: packaging/almalinux/qualify.sh "$PWD/dist/almalinux-10-x86_64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workgraph-almalinux-10-x86_64
          path: dist/almalinux-10-x86_64/
          if-no-files-found: warn
          retention-days: 14
